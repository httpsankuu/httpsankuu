# ------------------------------------------------------------------
# Contribution Snake Generator
#
# This workflow renders your GitHub contribution graph into a snake
# animation (SVG + GIF) and publishes it to the "output" branch of
# this repository. The README.md displays it with:
#
#   https://raw.githubusercontent.com/httpsankuu/httpsankuu/output/github-contribution-grid-snake-dark.svg
#
# It runs every 12 hours and can also be triggered manually from the
# Actions tab of your repository.
# ------------------------------------------------------------------

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate the snake files
        uses: Platane/snk@v3
        with:
          github_user_name: httpsankuu
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy snake to the "output" branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "chore: regenerate contribution snake"
